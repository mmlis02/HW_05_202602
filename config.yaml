# Configuración única del proyecto.
# Todas las rutas son relativas a la raíz del repositorio; src/config.py las resuelve a rutas absolutas.
# Ningún .py ni notebook escribe una ruta, un modelo, un umbral o un prompt a mano: los lee de aquí.

proyecto:
  idioma: es
  dominio_task2: restaurante
  # Base para convertir la disponibilidad relativa ("en dos semanas") en fecha absoluta.
  fecha_grabacion: "2026-10-31"
  # Solo para estimar la duración de un guion antes de grabarlo (habla conversacional).
  palabras_por_minuto_estimadas: 150
  duracion_clip_min: [2, 4]

rutas:
  enunciado: docs/enunciado.md
  requisitos: requirements.txt
  requisitos_gpu: requirements-gpu.txt          # cuBLAS 12 y cuDNN 9 con pip, para Colab con CUDA 13
  guiones: docs/guiones.md
  audios_dir: data/audio                       # copia local opcional, con los nombres originales; no se commitea
  audios_degradados_dir: data/audio_degradado  # L1-L3, se regeneran con 04_degradacion
  ruido_dir: data/ruido                        # audio de ruido ambiente para L3, no se commitea
  ground_truth_entrevistas: data/ground_truth/entrevistas.csv
  ground_truth_llamadas: data/ground_truth/llamadas.csv
  referencias_dir: data/referencias
  carta: data/referencias/carta.csv
  promociones: data/referencias/promociones.csv
  cache_dir: data/cache                        # transcripciones en JSON, commiteadas: la app y CI nunca re-transcriben
  resultados_dir: data/resultados
  duraciones: data/resultados/duraciones.csv                       # duración real de cada audio (02)
  mediciones_transcripcion: data/resultados/mediciones_transcripcion.csv  # una fila por corrida (02)
  wer_por_clip: data/resultados/wer_por_clip.csv                   # una fila por corrida y clip (02)
  glosario_por_clip: data/resultados/glosario_por_clip.csv         # WER con y sin glosario, pareado (02)
  # Los tres de arriba guardan el WER y el CER con la normalización de la corrida en Colab. Los
  # definitivos se recalculan desde la caché, sin transcribir, en 06_resultados (sección 1).
  metricas_transcripcion: data/resultados/metricas_transcripcion.csv  # WER y CER definitivos por corrida (06)
  metricas_por_clip: data/resultados/metricas_por_clip.csv            # WER y CER definitivos por corrida y clip (06)
  registro_por_campo: data/resultados/registro_por_campo.csv          # exactitud por campo y corrida, con audio real (06)
  registro_por_clip: data/resultados/registro_por_clip.csv            # WER y campos correctos por corrida y clip (06)
  validacion_audio: data/resultados/validacion_audio.csv              # validación de las llamadas por corrida (06)
  figura_wer_registro: data/resultados/wer_contra_registro.png        # gráfico WER contra registro (06)
  # Piloto del LLM, ronda 1 (prompts anteriores a la revisión): por variante y modelo, y tecnologías inventadas (03).
  llm_piloto_ronda1: data/resultados/llm_piloto_ronda1.csv
  llm_piloto_ronda1_tecnologias: data/resultados/llm_piloto_ronda1_tecnologias.csv
  registro_llm: data/resultados/registro_llm.csv                      # reglas contra LLM por corrida, clip y campo (06)
  # Las mismas tablas con la versión 1 de las reglas (PR #7); el notebook 06 comprueba que las reproduce.
  registro_por_campo_v1: data/resultados/registro_por_campo_v1.csv
  registro_por_clip_v1: data/resultados/registro_por_clip_v1.csv
  validacion_audio_v1: data/resultados/validacion_audio_v1.csv
  figura_wer_registro_v1: data/resultados/wer_contra_registro_v1.png
  modelos_dir: models                          # pesos descargados, no se commitean

archivos:
  patron_referencia: "{clip}.txt"

# Los audios son privados: no están en el repo, y el enlace a su carpeta tampoco. Se identifican por su
# nombre original, sin renombrarlos. Este mapeo es el único lugar donde aparecen esos nombres: a partir
# de aquí todo el código usa los clips e1 ... l5 (src/audios.py).
# Transcripciones guardadas como JSON, una por clip y corrida: <cache_dir>/<patron_transcripcion>.
cache:
  patron_transcripcion: "transcripciones/{corrida}/{clip}.json"
  # Respuestas del LLM, commiteadas: los notebooks y la app no vuelven a llamar al modelo. La clave es un
  # hash del modelo, los prompts, el esquema JSON, las opciones y la transcripción (src/extraccion_llm.py).
  patron_llm: "llm/{modelo}/{clave}.json"

# Colab. En Drive, salidas/ replica data/: al terminar, salidas/cache -> data/cache y
# salidas/resultados -> data/resultados.
colab:
  drive_salidas: /content/drive/MyDrive/HW_05_salidas
  # Se instalan con la versión fijada en requirements.txt; lo demás se usa tal como viene en Colab.
  paquetes: [faster-whisper, av, jiwer, text2num, nvidia-ml-py]
  # Modelo mínimo para comprobar, justo después de instalar, que la GPU transcribe de verdad.
  modelo_comprobacion: tiny

audios:
  archivos:
    task 1-1: e1
    task 1-2: e2
    task 1-3: e3
    task 1-4: e4
    task 1-5: e5
    task 2-1: l1
    task 2-2: l2
    task 2-3: l3
    task 2-4: l4
    task 2-5: l5
  # La extensión puede variar según el celular o la app de grabación.
  extensiones: [.m4a, .mp3, .wav, .ogg, .opus, .flac, .aac, .amr, .3gp, .mp4, .webm]
  # Colab: dónde se monta Drive y bajo qué carpeta se buscan los 10 archivos por su nombre.
  drive_montaje: /content/drive
  drive_raiz: /content/drive/MyDrive

asr:
  modelo: large-v3
  modelos_comparacion: [small, large-v3]
  # "auto" deja elegir a la librería; el device REAL se lee en tiempo de ejecución, nunca de aquí.
  dispositivo: auto
  compute_type:
    cuda: float16
    cpu: int8
  precisiones_comparacion: [float16, int8]
  beam_size: 5
  vad_filter: true
  word_timestamps: true          # la probabilidad por palabra alimenta la regla de diagnóstico
  # faster-whisper 1.2.1 acepta initial_prompt, hotwords o los dos (ver 02_transcripcion_gpu, sección 8).
  # El motor usa este; el notebook 02 compara los dos contra no pasar glosario.
  # Por defecto hotwords: ninguno de los dos mejora el WER de forma significativa (IC 95 % pareado
  # con el 0 dentro), pero hotwords es el único que transcribe bien los 40 términos del glosario dichos
  # en el corpus. initial_prompt escribe "Plim" en L4 y metodo_pago queda vacío; sin glosario, Nagios
  # (la tecnología abandonada de E3) sale "nacos" y la trampa no llega a probarse. Ver README, "Glosario".
  glosario_mecanismo: hotwords
  glosario_mecanismos_comparacion: [initial_prompt, hotwords]
  # Corrida rápida antes de la completa: un clip de cada tarea.
  clips_prueba_rapida: [e1, l1]
  # CPU contra GPU: solo el modelo pequeño y pocos clips, para que la sesión de Colab no expire.
  # float16 no existe en CPU, así que la comparación se hace en int8 en los dos devices.
  cpu:
    modelo: small
    compute_type: int8
    clips: [e1, l1]
  # Cada cuánto se consulta la memoria de la GPU (pynvml) mientras se transcribe.
  vram_intervalo_s: 0.05
  # Vocabulario del dominio, no la lista de respuestas: incluye términos que no aparecen en el corpus
  # (Java, Angular, Azure...) para que el glosario no sea una filtración del ground truth.
  # El glosario que recibe el ASR es la unión de las dos listas; extraccion_reglas usa solo tecnologias.
  glosario:
    tecnologias:
      - Python
      - Django
      - PostgreSQL
      - Docker
      - Power BI
      - SQL Server
      - pandas
      - Airflow
      - AWS
      - Azure
      - Kubernetes
      - Terraform
      - Jenkins
      - Grafana
      - Nagios
      - React
      - Angular
      - TypeScript
      - Next.js
      - Figma
      - Jest
      - Cypress
      - Selenium
      - Postman
      - Jira
      - JMeter
      - Java
      - Spring Boot
    restaurante:
      - La Leña Dorada
      - chicha morada
      - anticuchos
      - mollejitas
      - Yape
      - Plin
      - LEÑA5

normalizacion:
  # Misma regla para referencia e hipótesis antes de calcular WER/CER. Reglas en src/normalizacion.py.
  minusculas: true
  quitar_puntuacion: true
  palabras_a_numeros: true       # text2num.alpha2digit(texto, "es")
  quitar_tildes: false           # provisional: "esta" vs "está" sí es un error de transcripción
  colapsar_espacios: true
  # Números por debajo de este valor no se convierten cuando van sueltos: "un pollo", "una jarra"
  # y "cada uno" siguen siendo palabras. Dentro de un compuesto sí ("treinta y un" -> 31).
  umbral_numeros_pequenos: 2
  # El umbral no alcanza cuando el artículo va junto a otro número: text2num lee "casi un quince"
  # como "1 15" y "unos cuarenta" como "1 40". Estos artículos se apartan salvo detrás de otra
  # palabra numérica ("ciento un" -> 101, "tres dos uno" -> 321) o de "decena y" ("treinta y un" -> 31).
  articulos: [un, una, uno, unos, unas]
  # Formas que text2num no reconoce: apócope y palabras con tilde escritas sin ella.
  alias:
    veintiún: veintiuno
    veintiun: veintiuno
    veintidos: veintidós
    veintitres: veintitrés
    veintiseis: veintiséis
  # Se apartan antes de convertir y vuelven intactas: text2num convierte ordinales
  # ("tres cuartos de pollo" -> "3 4ᵒˢ") y "por ciento" ("por 100"). Se acepta el plural con -s.
  palabras_protegidas:
    - por ciento
    - primer
    - primero
    - primera
    - segundo
    - segunda
    - tercer
    - tercero
    - tercera
    - cuarto
    - cuarta
    - quinto
    - quinta
    - sexto
    - sexta
    - séptimo
    - séptima
    - octavo
    - octava
    - noveno
    - novena
    - décimo
    - décima
  # "<número> <unidad> y medio" -> "<número>.5 <unidad>". Solo unidades de tiempo: en "medio pollo"
  # o "litro y medio", "medio" es un tamaño y no se toca.
  unidades_y_medio: [año, años, mes, meses, hora, horas]
  # Una corrida de al menos tantos dígitos sueltos es un dictado y se une: "nueve ocho siete" -> 987.
  min_digitos_dictado: 3
  # Cifras mixtas: Whisper escribe "10 mil" y "1.5 millones" donde el guion dice "diez mil" y
  # "un millón y medio". Un multiplicador en palabra detrás de una cifra o de una de estas cantidades
  # se aparta de text2num y luego se multiplica: "10 mil" -> 10000, "1.5 millones" -> 1500000,
  # "medio millón" -> 500000. Una cifra menor que el multiplicador justo detrás se suma:
  # "10 mil 500" -> 10500, "2 millones 500 mil" -> 2500000.
  multiplicadores: {mil: 1000, millón: 1000000, millon: 1000000, millones: 1000000}
  cantidades_palabra: {un: 1, una: 1, medio: 0.5}
  # Códigos que se dicen separados y se escriben juntos: "LEÑA cinco" -> "LEÑA5".
  codigos: [LEÑA5]
  # Formato de Whisper (versión 2 de las reglas). Corrige cómo escribe, no lo que oye: con audio real
  # estos formatos rompían campos que el WER no veía (notebook 06, sección 5). palabras_a_numeros los
  # aplica primero, así que llegan igual a la extracción, a la verificación y al WER.
  # Separador de miles también al extraer: "6.500" -> 6500. Antes solo lo quitaba normalizar_texto.
  separador_miles: true
  # Símbolo pegado a la cifra -> cifra + la primera palabra: "$1.800" -> "1800 dólares".
  # Si la moneda ya se dice detrás ("$1.500 dólares"), no se repite.
  simbolos_moneda:
    "US$": [dólares, dólar]
    "$": [dólares, dólar]
    "S/.": [soles, sol]
    "S/": [soles, sol]
  # Guion entre letras -> espacio: "semi-senior" -> "semi senior". Entre cifras ("2-3") no se toca.
  guion_entre_letras: true
  # Puntuación aceptada entre el nombre de la vía y el número: "Calle Los Cedros, 245".
  # La usa la extracción de direccion_entrega.
  puntuacion_via_numero: ",."
  # La versión 1 (las reglas del PR #7) son estas mismas reglas con el formato de Whisper apagado.
  # El notebook 06 la reproduce con src.normalizacion.con_reglas(version_1).
  version_1:
    separador_miles: false
    simbolos_moneda: {}
    guion_entre_letras: false
    puntuacion_via_numero: ""

esquemas:
  entrevista:
    campos:
      anios_experiencia: numerico
      ultimo_puesto: texto
      tecnologias: lista
      pretension_salarial: numerico_moneda
      disponibilidad: fecha
      nivel_ingles: categorico
    clases:
      nivel_ingles: [basico, intermedio, avanzado]
    monedas: [PEN, USD]
    # Cómo se dice cada clase o moneda. Lo usan la extracción y la verificación.
    alias:
      nivel_ingles:
        basico: [básico, básica, basico, basica, elemental]
        intermedio: [intermedio, intermedia]
        avanzado: [avanzado, avanzada, fluido, fluida, nativo, nativa]
      moneda:
        PEN: [soles, sol, S/, nuevos soles]
        USD: [dólares, dólar, USD]
    # Marco europeo: se usa solo si no se dice ninguna palabra de nivel.
    mcer:
      A1: basico
      A2: basico
      B1: intermedio
      B2: intermedio
      C1: avanzado
      C2: avanzado
    moneda_por_defecto: PEN
  pedido:
    campos:
      items: lista_objetos
      promocion: texto_o_nulo
      descuento: numerico
      direccion_entrega: texto
      metodo_pago: categorico
      total_dicho: numerico
    clases:
      metodo_pago: [efectivo, yape, plin, tarjeta]
    alias:
      metodo_pago:
        efectivo: [efectivo, cash]
        yape: [yape, yapeo]
        plin: [plin]
        tarjeta: [tarjeta, visa, mastercard, débito, crédito]
      # Frases específicas: "código" solo no basta ("¿tiene algún código de promoción?" no es la promo).
      promocion:
        duo familiar: [dúo familiar, duo familiar]
        promo app: [LEÑA5, código de la app, código de la aplicación, descuento de la app, el de la app]
    # Cómo se nombra cada producto de la carta y sus tamaños. La etiqueta del tamaño es el comienzo del
    # tamaño en carta.csv ("jarra" -> "jarra de 1 litro"). Sin tamaños: el único tamaño de la carta.
    productos:
      pollo a la brasa:
        alias: [pollo, pollos]
        tamanos:
          entero: [entero, enteros]
          medio: [medio, medios]
          cuarto: [cuarto, cuartos]
      papas fritas:
        alias: [papa, papas]
        tamanos:
          familiar: [familiar, familiares]
          personal: [personal, personales]
      chicha morada:
        alias: [chicha, chichas, jarra, jarras, vaso, vasos]
        tamanos:
          jarra: [jarra, jarras]
          vaso: [vaso, vasos]
      gaseosa:
        alias: [gaseosa, gaseosas]
        tamanos:
          1.5 litros: [litro y medio, 1.5 litros]
          personal: [personal, personales]
      ensalada clásica:
        alias: [ensalada, ensaladas]
      anticuchos:
        alias: [anticucho, anticuchos]
        tamanos:
          porción: [porción, porciones]
      mollejitas:
        alias: [mollejita, mollejitas]
      torta de chocolate:
        alias: [torta, tortas]
        tamanos:
          porción: [porción, porciones]

extraccion:
  metodos: [reglas, llm]
  metodo: reglas                 # el que usa src/engine.py: "reglas" o "llm"
  # Con metodo "reglas", estos campos se toman del LLM; si el LLM falla, queda el de las reglas.
  # Es el único campo en que el LLM supera a las reglas con audio real (06_resultados, sección 6.7).
  campos_llm: [pretension_salarial]
  # Marcadores de src/extraccion_reglas.py. La transcripción no trae hablantes: una pregunta se
  # reconoce por sus palabras clave y su respuesta son las oraciones siguientes, hasta la próxima
  # pregunta ("?") o hasta `ventana_respuesta` oraciones.
  reglas:
    ventana_respuesta: 5
    correccion: ["no, perdón", perdón, me equivoqué, me confundí, corrijo, mejor dicho, mejor]
    # Una respuesta que empieza así declara el campo ausente en voz alta ("No, ninguno").
    negacion: ["no", ninguno, ninguna, nada, tampoco]
    entrevista:
      pregunta_pretension: [pretensión, expectativa, expectativas, salarial, sueldo, salario, cuánto estás buscando, cuánto buscas]
      salario_actual: [gano, ganando, gana, cobro, percibo, sueldo actual]
      ideal: [idealmente, lo ideal, ideal]
      monto_minimo: 100
      pregunta_experiencia: [años de experiencia, cuánta experiencia, su experiencia, tu experiencia, cuántos años]
      aproximacion: [casi, cerca de, más de, menos de]
      subconjunto: [los últimos, las últimas, de ellos, de esos]
      adicional: [y otro, y otros]
      anios_maximo: 50
      pregunta_disponibilidad: [cuándo podrías, cuándo podría, cuándo puedes, cuándo puede, desde cuándo, incorporarte, incorporarse, disponibilidad]
      inmediato: [de inmediato, inmediatamente, ya mismo, desde ya]
      pregunta_ingles: [inglés]
      cargos: [desarrollador, desarrolladora, programador, programadora, analista, jefe, jefa, líder, gerente, director, directora, coordinador, coordinadora, ingeniero, ingeniera, arquitecto, arquitecta, consultor, consultora, especialista, administrador, administradora, diseñador, diseñadora, tester, asistente, practicante]
      cargo_pasado: [empecé como, empezó como, inicié como, comencé como, antes fui, antes era, fui, era]
      cargo_ofrecido: [buscamos, el puesto es, la posición es, es para un, es para una]
      cargo_fin: [en, desde, para, con, y, hace, porque, pero, que, a, al]
      cargo_max_palabras: 6
      abandono: [lo apagamos, la apagamos, los apagamos, dejamos de usar, dejé de usar, ya no usamos, ya no uso, lo reemplazamos, lo abandonamos, migramos de, antes usábamos, antes usaba]
      continua: [todavía, aún, seguimos, sigo, mantenemos]
    pedido:
      confirmacion: [le confirmo, le repito, confirmo su pedido, confirmo el pedido, repaso su pedido, su pedido es]
      reemplazo: [en vez de, en lugar de]
      pregunta_promocion: [promoción, promociones, promo, código, códigos, descuento]
      pregunta_pago: [cómo va a pagar, cómo paga, cómo desea pagar, forma de pago, método de pago]
      tipos_via: [Calle, Avenida, Av, Jirón, Jr, Pasaje, Malecón, Prolongación, Carretera]
      complementos_direccion: [departamento, dpto, interior, oficina, piso, bloque, manzana, lote, torre]
  # Segundo camino: un LLM local en Ollama, con salida estructurada (esquema JSON). src/extraccion_llm.py.
  llm:
    proveedor: ollama
    url: http://localhost:11434
    modelo: qwen2.5:3b             # elegido en el piloto (03_extraccion, sección 4.1); justificación en el README
    # Probados en el piloto de 03_extraccion (variantes que no son del corpus); ver README.
    candidatos: [llama3.2:3b, qwen2.5:3b, phi4-mini:3.8b]
    temperatura: 0
    semilla: 42
    num_ctx: 4096                  # la entrevista más larga (E1) ocupa ~1050 tokens de entrada y ~350 de salida
    num_predict: 2048
    max_tecnologias: 15            # tope de la lista en el esquema JSON: sin él, un modelo puede repetir sin fin
    max_items: 12
    keep_alive: 10m
    timeout_s: 600
  # Prompts del LLM. La transcripción llega como la entrega Whisper: sin hablantes ni turnos.
  # Ronda 2 del piloto: se agregaron "solo lo que se dice", la lista de tecnologías vacía, la moneda por
  # defecto, el cálculo de la fecha y el formato de la dirección (03_extraccion, sección 4.1). Desde ahí
  # quedaron fijos: el corpus no se usó para escribirlos.
  prompts:
    sistema: |
      Eres un extractor de datos. Lees la transcripción automática de una conversación en español
      y devuelves solo el objeto JSON pedido.
      Reglas:
      - La transcripción no indica quién habla: dedúcelo por el contenido.
      - Para cada campo devuelve "valor" y "evidencia". "evidencia" es el fragmento EXACTO de la
        transcripción del que sale el valor, copiado carácter por carácter, sin cambiar ni corregir nada.
      - No corrijas la transcripción. Si una palabra parece mal oída, cópiala tal cual, también en el valor.
      - Si un campo no se dice, devuelve null en "valor" y en "evidencia".
      - Si alguien se corrige ("no, perdón", "mejor"), vale lo último que dice.
      - Los números van en dígitos.
      - Extrae solo lo que la transcripción dice. Nunca agregues valores que no aparecen en ella.
      - La evidencia es corta: la frase mínima que contiene el valor.
    entrevista: |
      Transcripción de una entrevista de trabajo entre un entrevistador y un candidato.
      Fecha de la grabación: {fecha_grabacion}.
      Extrae los datos del candidato:
      - anios_experiencia: años de experiencia total del candidato, como número (4.5 si dice "cuatro años y medio").
      - ultimo_puesto: su cargo actual o el último, tal como lo nombra.
      - tecnologias: las tecnologías (lenguajes, herramientas, plataformas) que la transcripción nombra y que
        usa hoy, cada una una sola vez y con su evidencia. No incluyas las que dejó de usar. Si no nombra
        ninguna, devuelve una lista vacía.
      - pretension_salarial: lo que pide ganar, no lo que gana hoy: {{"monto": número, "moneda": "PEN" o "USD"}}.
        Si da un rango y un ideal, vale el ideal. USD si dice dólares o $; PEN si dice soles o S/, o si no
        dice moneda.
      - disponibilidad: fecha en que puede empezar, en formato AAAA-MM-DD. "de inmediato" es la fecha de
        grabación; "en N días/semanas/meses" o "N meses de preaviso" se suman a la fecha de grabación; un día
        y un mes ("15 de noviembre") son la próxima fecha con ese día y mes desde la grabación.
      - nivel_ingles: basico, intermedio o avanzado.
      Transcripción:
      {transcript}
    pedido: |
      Transcripción de una llamada de pedido a la pollería La Leña Dorada, entre el vendedor y un cliente.
      Productos de la carta y sus tamaños: {productos}.
      Extrae el pedido FINAL, después de cualquier corrección:
      - items: cada producto pedido con "producto", "tamano", "cantidad" y "evidencia" (la mención de ese
        producto en la transcripción). El precio no se pide: sale de la carta.
      - promocion: duo familiar, promo app o null.
      - descuento: monto del descuento en soles; 0 si no hay.
      - direccion_entrega: la dirección final con este formato: tipo de vía, nombre y número en dígitos;
        después cada complemento (departamento, interior, piso, bloque) con su número; al final el distrito.
        Separados por comas, sin "en". Ejemplo: "Pasaje Las Rosas 88, piso 3, Breña".
      - metodo_pago: efectivo, yape, plin o tarjeta.
      - total_dicho: el total que dice el vendedor, aunque esté mal sumado.
      Transcripción:
      {transcript}

verificacion:
  etiqueta_verificado: verificado
  etiqueta_carta: verificado_carta     # solo precio_unitario: viene de la carta, no del audio
  etiqueta_no_verificado: sin_verificar
  etiqueta_no_mencionado: no_mencionado   # campo nulo del que no se encontró ninguna mención
  # En estos campos, 0 significa "no hay" y se verifica como un campo nulo (descuento 0 = sin promoción).
  cero_es_ausencia: [descuento]
  # El valor debe aparecer literalmente en la transcripción después de normalizar ambos lados
  # (minúsculas, sin puntuación, números a dígitos).
  modo: literal_normalizado

validacion:
  # Diferencia máxima, en soles, entre el total esperado y el dicho para que cuadre. También es la
  # tolerancia con la que una explicación coincide con la diferencia.
  tolerancia_total_soles: 0
  # Diagnóstico (src/validacion.py): una palabra numérica del total o de los ítems con probabilidad
  # (word.probability de faster-whisper) menor a este umbral es señal de error del ASR. Provisional:
  # se calibra con audio real en 05_validacion.
  umbral_probabilidad_palabra: 0.6
  # Palabras máximas que puede ocupar en la transcripción un número o la mención de un ítem.
  max_palabras_mencion: 12
  # Errores de una unidad, decena o centena: pueden ser una suma mal llevada o un número mal oído,
  # así que explican la diferencia pero no cuentan como causa humana.
  saltos_ambiguos: [1, 10, 100]

degradacion:
  semilla: 42
  niveles:
    L0:
      simula: tal como se grabó
    L1:
      simula: nota de voz de WhatsApp
      codec: libopus
      bitrate: 16k
      canales: 1
    L2:
      simula: llamada telefónica
      frecuencia_baja_hz: 300
      frecuencia_alta_hz: 3400
      sample_rate: 8000
    L3:
      simula: ambiente ruidoso
      base: L1
      snr_db: 5          # provisional: se justifica y, si L3 no degrada, se endurece en 04_degradacion

metricas:
  intervalo_confianza: 0.95
  bootstrap_iteraciones: 10000
  semilla: 42
  campo_macro_f1: nivel_ingles

app:
  titulo: De la voz al registro
  pestanas:
    - Problema y método
    - Corpus
    - Resultados
    - Probador
