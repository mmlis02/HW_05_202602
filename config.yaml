# Configuración única del proyecto.
# Todas las rutas son relativas a la raíz del repositorio; src/config.py las resuelve a rutas absolutas.
# Ningún .py ni notebook escribe una ruta, un modelo, un umbral o un prompt a mano: los lee de aquí.

proyecto:
  idioma: es
  dominio_task2: restaurante
  # Base para convertir la disponibilidad relativa ("en dos semanas") en fecha absoluta.
  fecha_grabacion: "2026-10-31"
  # Solo para estimar la duración de un guion antes de grabarlo (habla conversacional).
  palabras_por_minuto_estimadas: 150
  duracion_clip_min: [2, 4]

rutas:
  enunciado: docs/enunciado.md
  guiones: docs/guiones.md
  audios_dir: data/audio                       # e1.m4a ... l5.m4a, no se commitean
  audios_degradados_dir: data/audio_degradado  # L1-L3, se regeneran con 04_degradacion
  ruido_dir: data/ruido                        # audio de ruido ambiente para L3, no se commitea
  ground_truth_entrevistas: data/ground_truth/entrevistas.csv
  ground_truth_llamadas: data/ground_truth/llamadas.csv
  referencias_dir: data/referencias
  carta: data/referencias/carta.csv
  promociones: data/referencias/promociones.csv
  transcripciones_dir: data/transcripciones    # caché commiteada: la app y CI nunca re-transcriben
  resultados_dir: data/resultados
  modelos_dir: models                          # pesos descargados, no se commitean

archivos:
  extension_audio: .m4a
  patron_referencia: "{clip}.txt"

asr:
  modelo: large-v3
  modelos_comparacion: [small, large-v3]
  # "auto" deja elegir a la librería; el device REAL se lee en tiempo de ejecución, nunca de aquí.
  dispositivo: auto
  compute_type:
    cuda: float16
    cpu: int8
  precisiones_comparacion: [float16, int8]
  beam_size: 5
  vad_filter: true
  word_timestamps: true          # la probabilidad por palabra alimenta la regla de diagnóstico
  # initial_prompt o hotwords: qué soporta la versión instalada se resuelve en 02_transcripcion_gpu.
  glosario_mecanismo: initial_prompt
  # Vocabulario del dominio, no la lista de respuestas: incluye términos que no aparecen en el corpus
  # (Java, Angular, Azure...) para que el glosario no sea una filtración del ground truth.
  # El glosario que recibe el ASR es la unión de las dos listas; extraccion_reglas usa solo tecnologias.
  glosario:
    tecnologias:
      - Python
      - Django
      - PostgreSQL
      - Docker
      - Power BI
      - SQL Server
      - pandas
      - Airflow
      - AWS
      - Azure
      - Kubernetes
      - Terraform
      - Jenkins
      - Grafana
      - Nagios
      - React
      - Angular
      - TypeScript
      - Next.js
      - Figma
      - Jest
      - Cypress
      - Selenium
      - Postman
      - Jira
      - JMeter
      - Java
      - Spring Boot
    restaurante:
      - La Leña Dorada
      - chicha morada
      - anticuchos
      - mollejitas
      - Yape
      - Plin
      - LEÑA5

normalizacion:
  # Misma regla para referencia e hipótesis antes de calcular WER/CER. Reglas en src/normalizacion.py.
  minusculas: true
  quitar_puntuacion: true
  palabras_a_numeros: true       # text2num.alpha2digit(texto, "es")
  quitar_tildes: false           # provisional: "esta" vs "está" sí es un error de transcripción
  colapsar_espacios: true
  # Números por debajo de este valor no se convierten cuando van sueltos: "un pollo", "una jarra"
  # y "cada uno" siguen siendo palabras. Dentro de un compuesto sí ("treinta y un" -> 31).
  umbral_numeros_pequenos: 2
  # El umbral no alcanza cuando el artículo va junto a otro número: text2num lee "casi un quince"
  # como "1 15" y "unos cuarenta" como "1 40". Estos artículos se apartan salvo detrás de otra
  # palabra numérica ("ciento un" -> 101, "tres dos uno" -> 321) o de "decena y" ("treinta y un" -> 31).
  articulos: [un, una, uno, unos, unas]
  # Formas que text2num no reconoce: apócope y palabras con tilde escritas sin ella.
  alias:
    veintiún: veintiuno
    veintiun: veintiuno
    veintidos: veintidós
    veintitres: veintitrés
    veintiseis: veintiséis
  # Se apartan antes de convertir y vuelven intactas: text2num convierte ordinales
  # ("tres cuartos de pollo" -> "3 4ᵒˢ") y "por ciento" ("por 100"). Se acepta el plural con -s.
  palabras_protegidas:
    - por ciento
    - primer
    - primero
    - primera
    - segundo
    - segunda
    - tercer
    - tercero
    - tercera
    - cuarto
    - cuarta
    - quinto
    - quinta
    - sexto
    - sexta
    - séptimo
    - séptima
    - octavo
    - octava
    - noveno
    - novena
    - décimo
    - décima
  # "<número> <unidad> y medio" -> "<número>.5 <unidad>". Solo unidades de tiempo: en "medio pollo"
  # o "litro y medio", "medio" es un tamaño y no se toca.
  unidades_y_medio: [año, años, mes, meses, hora, horas]
  # Una corrida de al menos tantos dígitos sueltos es un dictado y se une: "nueve ocho siete" -> 987.
  min_digitos_dictado: 3
  # Códigos que se dicen separados y se escriben juntos: "LEÑA cinco" -> "LEÑA5".
  codigos: [LEÑA5]

esquemas:
  entrevista:
    campos:
      anios_experiencia: numerico
      ultimo_puesto: texto
      tecnologias: lista
      pretension_salarial: numerico_moneda
      disponibilidad: fecha
      nivel_ingles: categorico
    clases:
      nivel_ingles: [basico, intermedio, avanzado]
    monedas: [PEN, USD]
    # Cómo se dice cada clase o moneda. Lo usan la extracción y la verificación.
    alias:
      nivel_ingles:
        basico: [básico, básica, basico, basica, elemental]
        intermedio: [intermedio, intermedia]
        avanzado: [avanzado, avanzada, fluido, fluida, nativo, nativa]
      moneda:
        PEN: [soles, sol, S/, nuevos soles]
        USD: [dólares, dólar, USD]
    # Marco europeo: se usa solo si no se dice ninguna palabra de nivel.
    mcer:
      A1: basico
      A2: basico
      B1: intermedio
      B2: intermedio
      C1: avanzado
      C2: avanzado
    moneda_por_defecto: PEN
  pedido:
    campos:
      items: lista_objetos
      promocion: texto_o_nulo
      descuento: numerico
      direccion_entrega: texto
      metodo_pago: categorico
      total_dicho: numerico
    clases:
      metodo_pago: [efectivo, yape, plin, tarjeta]
    alias:
      metodo_pago:
        efectivo: [efectivo, cash]
        yape: [yape, yapeo]
        plin: [plin]
        tarjeta: [tarjeta, visa, mastercard, débito, crédito]
      # Frases específicas: "código" solo no basta ("¿tiene algún código de promoción?" no es la promo).
      promocion:
        duo familiar: [dúo familiar, duo familiar]
        promo app: [LEÑA5, código de la app, código de la aplicación, descuento de la app, el de la app]
    # Cómo se nombra cada producto de la carta y sus tamaños. La etiqueta del tamaño es el comienzo del
    # tamaño en carta.csv ("jarra" -> "jarra de 1 litro"). Sin tamaños: el único tamaño de la carta.
    productos:
      pollo a la brasa:
        alias: [pollo, pollos]
        tamanos:
          entero: [entero, enteros]
          medio: [medio, medios]
          cuarto: [cuarto, cuartos]
      papas fritas:
        alias: [papa, papas]
        tamanos:
          familiar: [familiar, familiares]
          personal: [personal, personales]
      chicha morada:
        alias: [chicha, chichas, jarra, jarras, vaso, vasos]
        tamanos:
          jarra: [jarra, jarras]
          vaso: [vaso, vasos]
      gaseosa:
        alias: [gaseosa, gaseosas]
        tamanos:
          1.5 litros: [litro y medio, 1.5 litros]
          personal: [personal, personales]
      ensalada clásica:
        alias: [ensalada, ensaladas]
      anticuchos:
        alias: [anticucho, anticuchos]
        tamanos:
          porción: [porción, porciones]
      mollejitas:
        alias: [mollejita, mollejitas]
      torta de chocolate:
        alias: [torta, tortas]
        tamanos:
          porción: [porción, porciones]

extraccion:
  metodos: [reglas, llm]
  # Marcadores de src/extraccion_reglas.py. La transcripción no trae hablantes: una pregunta se
  # reconoce por sus palabras clave y su respuesta son las oraciones siguientes, hasta la próxima
  # pregunta ("?") o hasta `ventana_respuesta` oraciones.
  reglas:
    ventana_respuesta: 5
    correccion: ["no, perdón", perdón, me equivoqué, me confundí, corrijo, mejor dicho, mejor]
    entrevista:
      pregunta_pretension: [pretensión, expectativa, expectativas, salarial, sueldo, salario, cuánto estás buscando, cuánto buscas]
      salario_actual: [gano, ganando, gana, cobro, percibo, sueldo actual]
      ideal: [idealmente, lo ideal, ideal]
      monto_minimo: 100
      pregunta_experiencia: [años de experiencia, cuánta experiencia, su experiencia, tu experiencia, cuántos años]
      aproximacion: [casi, cerca de, más de, menos de]
      subconjunto: [los últimos, las últimas, de ellos, de esos]
      adicional: [y otro, y otros]
      anios_maximo: 50
      pregunta_disponibilidad: [cuándo podrías, cuándo podría, cuándo puedes, cuándo puede, desde cuándo, incorporarte, incorporarse, disponibilidad]
      inmediato: [de inmediato, inmediatamente, ya mismo, desde ya]
      pregunta_ingles: [inglés]
      cargos: [desarrollador, desarrolladora, programador, programadora, analista, jefe, jefa, líder, gerente, director, directora, coordinador, coordinadora, ingeniero, ingeniera, arquitecto, arquitecta, consultor, consultora, especialista, administrador, administradora, diseñador, diseñadora, tester, asistente, practicante]
      cargo_pasado: [empecé como, empezó como, inicié como, comencé como, antes fui, antes era, fui, era]
      cargo_ofrecido: [buscamos, el puesto es, la posición es, es para un, es para una]
      cargo_fin: [en, desde, para, con, y, hace, porque, pero, que, a, al]
      cargo_max_palabras: 6
      abandono: [lo apagamos, la apagamos, los apagamos, dejamos de usar, dejé de usar, ya no usamos, ya no uso, lo reemplazamos, lo abandonamos, migramos de, antes usábamos, antes usaba]
      continua: [todavía, aún, seguimos, sigo, mantenemos]
    pedido:
      confirmacion: [le confirmo, le repito, confirmo su pedido, confirmo el pedido, repaso su pedido, su pedido es]
      reemplazo: [en vez de, en lugar de]
      pregunta_pago: [cómo va a pagar, cómo paga, cómo desea pagar, forma de pago, método de pago]
      tipos_via: [Calle, Avenida, Av, Jirón, Jr, Pasaje, Malecón, Prolongación, Carretera]
      complementos_direccion: [departamento, dpto, interior, oficina, piso, bloque, manzana, lote, torre]
  llm:
    proveedor: anthropic
    modelo: claude-haiku-5-5
    temperatura: 0
    max_tokens: 1500
    variable_api_key: ANTHROPIC_API_KEY
  prompts:
    sistema: |
      Eres un extractor de datos. Lees la transcripción automática de una conversación en español
      y devuelves solo un objeto JSON válido, sin texto adicional.
      Reglas:
      - Para cada campo devuelve "valor" y "evidencia". "evidencia" es el fragmento EXACTO de la
        transcripción del que sale el valor, copiado carácter por carácter.
      - No corrijas la transcripción. Si una palabra parece mal oída, cópiala tal cual.
      - Si un campo no se dice, devuelve null en "valor" y en "evidencia".
      - Si el hablante se corrige, vale lo último que dice.
    entrevista: |
      Transcripción de una entrevista de trabajo. A entrevista, B es el candidato.
      Fecha de la grabación: {fecha_grabacion}.
      Extrae del candidato:
      - anios_experiencia: número de años de experiencia total.
      - ultimo_puesto: cargo actual o último cargo.
      - tecnologias: lista de tecnologías que usa hoy (no las que abandonó).
      - pretension_salarial: {{"monto": número, "moneda": "PEN" o "USD"}}. Es lo que pide, no lo que
        gana hoy. Si da un rango y un ideal, vale el ideal.
      - disponibilidad: fecha absoluta AAAA-MM-DD en que puede empezar, calculada desde la fecha de grabación.
      - nivel_ingles: una de basico, intermedio, avanzado.
      Transcripción:
      {transcript}
    pedido: |
      Transcripción de una llamada de pedido a la pollería La Leña Dorada. A es el vendedor, B el cliente.
      Extrae el pedido FINAL (después de cualquier corrección del cliente):
      - items: lista de {{"producto", "tamano", "cantidad", "precio_unitario"}}.
      - promocion: nombre de la promoción aplicada o null.
      - descuento: monto del descuento en soles (0 si no hay).
      - direccion_entrega: dirección final con números en dígitos.
      - metodo_pago: uno de efectivo, yape, plin, tarjeta.
      - total_dicho: total que dice el vendedor en voz alta, aunque esté mal sumado.
      Transcripción:
      {transcript}

verificacion:
  etiqueta_verificado: verificado
  etiqueta_no_verificado: sin_verificar
  # El valor debe aparecer literalmente en la transcripción después de normalizar ambos lados
  # (minúsculas, sin puntuación, números a dígitos).
  modo: literal_normalizado

validacion:
  tolerancia_total_soles: 0
  # Regla de diagnóstico ASR vs hablante (a calibrar en 05_validacion): si alguna palabra numérica
  # del pedido tiene probabilidad menor a este umbral, la discrepancia se atribuye al ASR.
  umbral_probabilidad_palabra: 0.6

degradacion:
  semilla: 42
  niveles:
    L0:
      simula: tal como se grabó
    L1:
      simula: nota de voz de WhatsApp
      codec: libopus
      bitrate: 16k
      canales: 1
    L2:
      simula: llamada telefónica
      frecuencia_baja_hz: 300
      frecuencia_alta_hz: 3400
      sample_rate: 8000
    L3:
      simula: ambiente ruidoso
      base: L1
      snr_db: 5          # provisional: se justifica y, si L3 no degrada, se endurece en 04_degradacion

metricas:
  intervalo_confianza: 0.95
  bootstrap_iteraciones: 10000
  semilla: 42
  campo_macro_f1: nivel_ingles

app:
  titulo: De la voz al registro
  pestanas:
    - Problema y método
    - Corpus
    - Resultados
    - Probador
